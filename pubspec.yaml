name: crusher_management
description: Crusher Management System for offline operations
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: ">=2.17.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State management
  get: ^4.6.5
  
  # Database
  sqflite: ^2.2.8+4
  path: ^1.8.3
  
  # Storage
  shared_preferences: ^2.1.1
  get_storage: ^2.1.1
  
  # UI
  cupertino_icons: ^1.0.5
  google_fonts: ^4.0.4
  data_table_2: ^2.4.2
  flutter_svg: ^2.0.5
  intl: ^0.18.1
  equatable: ^2.0.5
  
  # PDF
  pdf: ^3.10.4
  printing: ^5.11.0
  
  # File handling
  path_provider: ^2.0.15
  file_picker: ^5.3.1
  
  # Network
  connectivity_plus: ^4.0.1
  http: ^1.0.0
  
  # Window management (for desktop)
  window_size:
    git:
      url: https://github.com/google/flutter-desktop-embedding.git
      path: plugins/window_size
      ref: 6c66ad23ee79749f30a8eece542cf54eaf157ed8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
  
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
